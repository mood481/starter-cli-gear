schemaVersion: 1
id: starter-cli-go
name: CLI Starter

modes:
  standalone:
    template:
      path: templates/standalone
    placeholders:
      required:
        - PROJECT_NAME
        - PROJECT_SLUG
        - PROJECT_DESCRIPTION
  module:
    template:
      path: templates/module
    placeholders:
      required:
        - PROJECT_NAME
        - PROJECT_SLUG
        - PROJECT_DESCRIPTION
defaultMode: module

